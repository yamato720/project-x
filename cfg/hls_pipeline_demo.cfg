[connectivity]
# 单 kernel 内部 dataflow demo。
nk=krnl_hls_pipeline_demo:1:krnl_hls_pipeline_demo_1

# 三个独立 XRT kernel 组成的 kernel 级流水线。
nk=krnl_hls_pipeline_source:1:krnl_hls_pipeline_source_1
nk=krnl_hls_pipeline_compute:1:krnl_hls_pipeline_compute_1
nk=krnl_hls_pipeline_sink:1:krnl_hls_pipeline_sink_1

# 跨 kernel 的 AXI4-Stream 连接。
# source.output_stream -> compute.input_stream -> sink.input_stream
stream_connect=krnl_hls_pipeline_source_1.output_stream:krnl_hls_pipeline_compute_1.input_stream
stream_connect=krnl_hls_pipeline_compute_1.output_stream:krnl_hls_pipeline_sink_1.input_stream
